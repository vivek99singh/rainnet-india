[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rainnet-india"
version = "0.1.0"
description = "Experimental India radar-input and alert workflow for RainNet2024"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4"]

[project.scripts]
rainnet-india = "rainnet_india.cli:main"

[tool.setuptools.packages.find]
include = ["rainnet_india*"]
